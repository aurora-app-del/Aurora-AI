- name: Instalar ferramentas Android
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.1.0"

      - name: Aceitar licenças
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

      - name: Encontrar e configurar AIDL
        run: |
          echo "Procurando AIDL..."

          AIDL_PATH=$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f \
            -name "aidl" \
            -perm -111 \
            | sort -V \
            | tail -n 1)

          if [ -z "$AIDL_PATH" ]; then
            echo "ERRO: AIDL NÃO FOI ENCONTRADO!"
            echo "Build Tools instalados:"
            find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name "aidl" -print || true
            exit 1
          fi

          echo "AIDL encontrado em:"
          echo "$AIDL_PATH"

          AIDL_DIR=$(dirname "$AIDL_PATH")

          echo "Adicionando ao PATH:"
          echo "$AIDL_DIR"

          echo "$AIDL_DIR" >> "$GITHUB_PATH"

      - name: Verificar AIDL
        run: |
          echo "Localização do AIDL:"
          which aidl

          echo "Testando AIDL:"
          aidl --help > /dev/null

          echo "AIDL funcionando corretamente!"
