name: Build Aurora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: aurora-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Aurora APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3"

      - name: Fix Aurora
        run: |
          sed -i 's/aurora\.chat(text)/aurora.think(text)/g' aurora_app.py

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      - name: Install Android SDK tools
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Accept Android licenses again
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      - name: Preparar SDK do Buildozer
        shell: bash
        run: |
          echo "=== Preparando SDK do Buildozer ==="

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$BUILD_SDK"

          echo "Instalando Build Tools 37.0.0 no SDK do Buildozer..."

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$BUILD_SDK" \
            --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$BUILD_SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo ""
          echo "Build Tools instalados:"
          ls -la "$BUILD_SDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$BUILD_SDK/build-tools" \
            -type f \
            -name "aidl" \
            -print

      - name: Setup AIDL
        shell: bash
        run: |
          echo "=== Procurando AIDL ==="

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          AIDL_PATH=""

          while IFS= read -r file; do
            if [ -x "$file" ]; then
              AIDL_PATH="$file"
            fi
          done < <(
            find "$BUILD_SDK/build-tools" \
              -type f \
              -name "aidl" \
              2>/dev/null | sort -V
          )

          if [ -z "$AIDL_PATH" ]; then
            echo "ERRO: AIDL não encontrado."
            echo ""
            echo "Build Tools disponíveis:"
            find "$BUILD_SDK/build-tools" \
              -maxdepth 2 \
              -type f \
              -name "aidl" \
              -print 2>/dev/null || true

            exit 1
          fi

          AIDL_DIR="$(dirname "$AIDL_PATH")"

          echo "AIDL encontrado:"
          echo "$AIDL_PATH"

          echo "Diretório:"
          echo "$AIDL_DIR"

          echo "$AIDL_DIR" >> "$GITHUB_PATH"
          echo "AIDL_PATH=$AIDL_PATH" >> "$GITHUB_ENV"

      - name: Verify AIDL
        shell: bash
        run: |
          echo "=== Verificação do AIDL ==="

          echo "which aidl:"
          which aidl

          echo ""
          echo "AIDL:"
          aidl --help > /dev/null

          echo ""
          echo "AIDL funcionando corretamente!"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: bin/*.apk
          if-no-files-found: error
