name: Build Aurora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Corrigir integração Aurora
        run: |
          sed -i 's/aurora\.chat(text)/aurora.think(text)/g' aurora_app.py

      - name: Construir APK
        run: |
          buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: bin/*.apk
